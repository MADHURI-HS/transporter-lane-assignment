spring.application.name=transporter-lane-assignment
server.port=${PORT:8080}

# H2 in-memory by default. Set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD to use PostgreSQL instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:transporters;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Wall-clock limit for the optimiser (worst case only; typical inputs finish in milliseconds)
assignment.solver.time-budget-ms=8000

springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework
